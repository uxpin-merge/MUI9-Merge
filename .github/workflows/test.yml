name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # themes.js is GENERATED from tokens.json (and feeds the AI prompt
      # defaults) — a dirty diff means someone changed tokens without
      # regenerating
      - name: Theme generator in sync
        run: npm run generate:themes && git diff --exit-code themes.js

      - name: Test suites
        run: npm test -- --ci
